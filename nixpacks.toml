[variables]
NIXPACKS_NODE_VERSION = "22.18.0"
NPM_CONFIG_PRODUCTION = "false"
PIPELINE_PYTHON = "/opt/pipeline-venv/bin/python"
PIPELINE_STEALTH_MODE = "standard"

[phases.setup]
nixPkgs = ["...", "python311", "python311Packages.pip", "chromium"]
nixLibs = ["...", "stdenv.cc.cc.lib"]

# The vite.plus installer moved vp from /root/.vite-plus/bin to
# /root/.local/share/vite-plus/bin and ships an env file for activation;
# resolve vp via PATH instead of a hardcoded binary location.
[phases.install]
cmds = [
  "curl -fsSL https://vite.plus | bash",
  ". /root/.config/vite-plus/env && vp install --frozen-lockfile",
  "python3 -m venv /opt/pipeline-venv",
  "/opt/pipeline-venv/bin/pip install --no-cache-dir -r pipeline/requirements.txt",
]

[phases.build]
cmds = [". /root/.config/vite-plus/env && vp build"]

[start]
cmd = "HOST=0.0.0.0 node build/index.js"
